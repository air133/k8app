suite: VaultStaticSecret
templates:
  - secrets/vault-static-secret.yaml
values:
  - ../values.yaml

tests:
  - it: should not render when provider is none (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should create one VaultStaticSecret per unique path
    set:
      appName: myapp
      environment: dev
      secretsProvider:
        provider: vault
      secrets:
        DB_PASSWORD: "brand/myapp/{env}/config"
        API_KEY: "brand/myapp/{env}/config"
        SHARED_TOKEN: "brand/shared/{env}/config"
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: VaultStaticSecret

  - it: should not render rolloutRestartTargets by default
    set:
      appName: myapp
      environment: dev
      secretsProvider:
        provider: vault
      secrets:
        DB_PASSWORD: "brand/myapp/{env}/config"
    asserts:
      - notExists:
          path: spec.rolloutRestartTargets

  - it: should render the main Deployment as restart target when rolloutRestart is enabled
    set:
      appName: myapp
      environment: dev
      secretsProvider:
        provider: vault
        vault:
          rolloutRestart: true
      secrets:
        DB_PASSWORD: "brand/myapp/{env}/config"
    asserts:
      - equal:
          path: spec.rolloutRestartTargets
          value:
            - kind: Deployment
              name: myapp

  - it: should include worker Deployments as restart targets
    set:
      appName: myapp
      environment: dev
      secretsProvider:
        provider: vault
        vault:
          rolloutRestart: true
      secrets:
        DB_PASSWORD: "brand/myapp/{env}/config"
      worker:
        enabled: true
        spec:
          default:
            command: ["./worker"]
          priority:
            command: ["./worker"]
    asserts:
      - equal:
          path: spec.rolloutRestartTargets
          value:
            - kind: Deployment
              name: myapp
            - kind: Deployment
              name: myapp-default
            - kind: Deployment
              name: myapp-priority
